[project]
name = "rock-paper-scissors"
version = "0.1.0"
description = """
Agent Based Modelling of Rock Paper Scissors dynamics with
genetic algortihms to evolve competition dynamics
"""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "leap-ec>=0.8.2",
    "matplotlib>=3.10.9",
    "mesa[rec]>=3.5.1",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "notebook>=7.5.6",
    "pyqt6>=6.11.0",
]
